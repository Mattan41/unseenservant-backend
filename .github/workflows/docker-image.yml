name: Build and Push Backend Docker Image

# Two events, two different sets of tags:
#   release published -> :latest and the release tag (production)
#   push to main      -> :main only (staging)
# Production watchtower polls :latest, so a merge to main must never be able to
# move that tag. The decision lives in the "Resolve image tags" step of the
# merge job, and the step after it re-checks the result before anything is
# pushed. (This file used to tag from github.ref_name, which on a push to main
# would have resolved to "main" for :main and :latest alike.)
on:
  release:
    types: [published]
  push:
    branches: [main]

env:
  IMAGE_NAME: mattan41/unseenservant-backend
  CACHE_REGISTRY: ghcr.io

concurrency:
  # One group per ref, and never cancel: a merge must not kill a running release
  # build, and two merges must not race on the same :main tag.
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- DOCKER SETUP ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BUILD AND PUSH (one native runner per architecture, by digest) ---
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=registry,ref=${{ env.CACHE_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.CACHE_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Which tags this run is allowed to move. Kept in one place on purpose:
      # production watchtower follows :latest, so a merge to main must not be
      # able to reach it.
      - name: Resolve image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            release)
              if [ -z "$RELEASE_TAG" ]; then
                echo "::error::release event without a tag name"
                exit 1
              fi
              {
                echo "args=-t ${IMAGE_NAME}:latest -t ${IMAGE_NAME}:${RELEASE_TAG}"
                echo "primary=${IMAGE_NAME}:${RELEASE_TAG}"
              } >> "$GITHUB_OUTPUT"
              ;;
            push)
              {
                echo "args=-t ${IMAGE_NAME}:main"
                echo "primary=${IMAGE_NAME}:main"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

      # Fails before anything is pushed if the resolution above ever regresses
      # into moving :latest outside a release.
      - name: Guard :latest against non-release events
        if: github.event_name != 'release'
        env:
          TAG_ARGS: ${{ steps.tags.outputs.args }}
        run: |
          case "$TAG_ARGS" in
            *:latest*) echo "::error::refusing to publish :latest outside a release"; exit 1 ;;
            *) echo "ok: $TAG_ARGS" ;;
          esac

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ steps.tags.outputs.args }} \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ steps.tags.outputs.primary }}
