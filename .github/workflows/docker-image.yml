name: Build and Push Docker Images

on:
  push:
    branches:
      - docker-release
  pull_request:
    branches:
      - docker-release

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.42
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    permissions:
      contents: read
      packages: write

    env:
      GOOGLE_ID: ${{ secrets.GOOGLE_ID }}
      GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
      GITHUB_ID: ${{ secrets.GITH_ID }}
      GITHUB_SECRET: ${{ secrets.GITH_SECRET }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_WHITELIST: ${{ secrets.ADMIN_WHITELIST }}
      USER_WHITELIST: ${{ secrets.USER_WHITELIST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- BACKEND BUILD ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and package Backend
        run: mvn -B package --file backend/pom.xml -DskipTests

      # --- FRONTEND BUILD (Nytt/Optimerat) ---
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install and Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # --- DOCKER SETUP ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # --- PUSH IMAGES ---
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            mattan41/webapplication:unseen-servant-backend-latest
            mattan41/webapplication:unseen-servant-backend-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            mattan41/webapplication:unseen-servant-frontend-latest
            mattan41/webapplication:unseen-servant-frontend-${{ github.sha }}
