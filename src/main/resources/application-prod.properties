# Connect to the docker container mysql
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

server.address=0.0.0.0
server.port=8080

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.baseline-on-migrate=true

# Use this for local development with docker-compose and nginx
# todo: This can probably be removed with its usage now that customOath2SuccessHandler use x-forwarded-proto
FRONTEND_URL=http://localhost

# All allowed frontend origins
ALLOWED_ORIGINS=https://unseenservant.se,https://dev.unseenservant.se

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

server.forward-headers-strategy=framework

# User whitelist
ADMIN_WHITELIST=${ADMIN_WHITELIST}
USER_WHITELIST=${USER_WHITELIST}

# OAUTH
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.github.client-id=${GITHUB_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
