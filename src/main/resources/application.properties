spring.application.name=backend
spring.main.banner-mode=off
spring.jpa.open-in-view=false

# Concurrency. One virtual thread per request: Tomcat's worker-thread pool no
# longer caps concurrency (its VirtualThreadExecutor is unbounded), so the real
# ceilings are max-connections below and the Hikari pool. See
# docs/ARCHITECTURE.md ("Concurrency") before changing any of these.
spring.threads.virtual.enabled=true

# Blast-radius bound for a single-box deployment. Tomcat's default of 8192 would
# let a flood open far more sockets than the host should carry. Revisit if a
# load balancer is introduced.
server.tomcat.max-connections=500

# Covers concurrent requests: a request holds its connection for its whole
# transaction (several sequential queries), and the ship image uploads hold one
# for the duration of a disk write. Deliberately generous for the ~7-user scale
# but well below the point where a 4-core InnoDB loses throughput to context
# switching. Fail fast (10s) instead of the 30s default when the pool is full.
# This is a judgement call, not a tuned value - the pool is not the bottleneck.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=10000

# File uploads - use environment variable for container path
file.upload-dir=${FILE_UPLOAD_DIR}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Application-level upload limit enforced by FileStorageService
app.upload.max-file-size=5MB

# Framework failures - a malformed body, a parameter of the wrong type, an
# unsupported media type, an unknown path, an upload past the multipart limit -
# are answered by GlobalExceptionHandler, which extends ResponseEntityExceptionHandler.
# This property keeps the framework's own fallback advice in the same RFC 9457
# shape should that advice ever be absent. See docs/ARCHITECTURE.md.
spring.mvc.problemdetails.enabled=true

# Login throttle. Every attempt at /api/auth/login costs a database lookup and a
# BCrypt comparison, so repeated guesses are both a password attack and a CPU
# attack. The nginx limit_req in front of this is per-address only - a username
# sits in a POST body, so a proxy cannot see it - which is why there are two
# axes here. See docs/ARCHITECTURE.md ("Login") before changing these.
#
# In-memory and per-instance: two backend instances would allow the full budget
# each. That is deliberate at this scale, where a shared counter would mean
# Redis; nginx's per-address limit stays as the layer underneath.
app.rate-limit.enabled=true
app.rate-limit.window=1m
app.rate-limit.ip-attempts=20
app.rate-limit.username-attempts=5

# Ceiling on tracked keys. Reaching it means every tracked key is inside its
# window, which only an attacker cycling addresses can arrange; the limiter then
# makes the request wait instead of growing with the attack.
app.rate-limit.max-tracked-keys=10000

spring.h2.console.enabled=false
