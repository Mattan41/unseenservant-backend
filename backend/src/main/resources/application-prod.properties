# Connect to the docker container mysql
spring.datasource.url=jdbc:mysql://mysql:3306/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret

server.address=0.0.0.0
server.port=8080


# Use this for local development with docker-compose and nginx
# todo: This can probably be removed with its usage now that customOath2SuccessHandler use x-forwarded-proto
FRONTEND_URL=http://localhost

# All allowed frontend origins
ALLOWED_ORIGINS=https://unseenservant.se,https://dev.unseenservant.se

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

server.forward-headers-strategy=framework

