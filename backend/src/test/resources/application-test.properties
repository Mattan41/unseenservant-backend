# ===================================================================
# Spring Boot Test Configuration
# ===================================================================
# This profile is used when running tests with @SpringBootTest
# and @ActiveProfiles("test")
# JPA/Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Disable Docker Compose during tests (Testcontainers will handle this)
spring.docker.compose.enabled=false
# Frontend URL for tests (doesn't need to be real)
FRONTEND_URL=http://localhost:5173
ALLOWED_ORIGINS=http://localhost:5173
# Test Whitelist Configuration
# These emails will be loaded by WhitelistLoader during test startup
ADMIN_WHITELIST=admin@test.com
USER_WHITELIST=user1@test.com,user2@test.com,testuser@test.com
# OAuth2 Configuration for Tests
# These are dummy values - actual OAuth2 will be mocked in tests
spring.security.oauth2.client.registration.google.client-id=test-google-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.github.client-id=test-github-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email
# File Upload Configuration for Tests
file.upload-dir=./target/test-uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.test=DEBUG
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Flyway - Will run migrations in Testcontainer
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=test-jwt-secret-key-for-testing-only-do-not-use-in-production-123456789
jwt.expiration-ms=86400000